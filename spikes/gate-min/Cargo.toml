[package]
name = "gate-min"
description = "Throwaway offline encoding and MPC integration spike, never an activated gate"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace]
resolver = "3"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.1"
image_digest = "sha256:c9655eaf7436b90c87ea8b25739f91063032c5c30ba24cfeafe72c142943b5bb"
passed_env = ["CARGO_BUILD_JOBS"]
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
near-sdk = "=5.29.1"
omni-transaction = { version = "=0.5.0", default-features = false, features = ["evm"] }
alloy-sol-types = { version = "=1.7.3", default-features = false }
constitution-types = { path = "../../crates/constitution-types" }
hex = "0.4.3"

[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["unit-testing"] }
near-parameters = "0.37.4"
k256 = { version = "0.13.4", features = ["arithmetic"] }
sha3 = "0.10.8"
bs58 = "0.5.1"
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[profile.dev]
debug = 0
incremental = false

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
