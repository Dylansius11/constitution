[workspace]
resolver = "3"
members = [
    "crates/constitution-types",
    "crates/gate",
    "crates/verifier",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "UNLICENSED"
repository = "https://github.com/Dylansius11/constitution"
publish = false

[workspace.dependencies]
constitution-types = { path = "crates/constitution-types" }
borsh = { version = "=1.8.1", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
schemars = "=0.8.22"
near-account-id = { version = "=2.6.0", features = ["serde", "borsh", "schemars-v0_8"] }
sha2 = { version = "=0.11.1", default-features = false }
base64 = { version = "=0.23.1", default-features = false, features = ["alloc"] }
serde_json = "=1.0.154"
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }

[profile.release]
codegen-units = 1
lto = true
overflow-checks = true

# Gate wasm size matters; verifier and CLI keep speed (revm).
[profile.release.package.constitution-gate]
opt-level = "z"
