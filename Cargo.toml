[workspace]
resolver = "3"
members = [
    "crates/constitution-types",
    "crates/gate",
    "crates/verifier",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "UNLICENSED"
repository = "https://github.com/Dylansius11/constitution"
publish = false

[workspace.dependencies]
constitution-types = { path = "crates/constitution-types" }
borsh = { version = "=1.8.1", features = ["derive", "unstable__schema"] }
serde = { version = "=1.0.229", features = ["derive"] }
schemars = "=0.8.22"
near-account-id = { version = "=2.6.0", features = ["serde", "borsh", "schemars-v0_8", "abi"] }
sha2 = { version = "=0.11.1", default-features = false }
base64 = { version = "=0.23.1", default-features = false, features = ["alloc"] }
serde_json = "=1.0.154"
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
near-sdk = "=5.29.1"
near-workspaces = "=0.23.0"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread"] }
axum = "=0.8.9"
crypto_box = { version = "=0.9.1", features = ["seal"] }
ed25519-dalek = "=3.0.0"
sha3 = "=0.12.0"
tempfile = "=3.27.0"
omni-transaction = { version = "=0.5.0", default-features = false, features = ["evm"] }
alloy-sol-types = { version = "=1.7.3", default-features = false }
hex = "=0.4.3"
rlp = "=0.6.1"
k256 = { version = "=0.13.4", features = ["arithmetic"] }
clap = { version = "=4.6.7", features = ["derive", "env"] }
reqwest = { version = "=0.13.5", features = ["blocking", "json"] }
bs58 = "=0.5.1"

[profile.release]
codegen-units = 1
lto = true
overflow-checks = true

# Gate wasm size matters; verifier and CLI keep speed (revm).
[profile.release.package.constitution-gate]
opt-level = "z"
