[profile.default]
src = "src"
test = "test"
solc = "/usr/local/bin/solc"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
ffi = false
# Foundry 1.8.6 defaults true and rewrites `new` to unsupported vm.deployCode.
dynamic_test_linking = false
build_info = true
extra_output = ["storageLayout"]
remappings = ["@openzeppelin/contracts/=lib/openzeppelin/", "forge-std/=lib/forge-std/"]
